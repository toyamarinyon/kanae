name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Kanae version, for example 0.1.1
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs
        env:
          KANAE_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "releases must run from main, got: $GITHUB_REF" >&2
            exit 1
          fi
          case "$KANAE_VERSION" in
            v*)
              echo "version must not include the leading v: $KANAE_VERSION" >&2
              exit 1
              ;;
            *[!0-9.]* | "" | *..* | .* | *.)
              echo "version must be a dotted numeric version like 0.1.0: $KANAE_VERSION" >&2
              exit 1
              ;;
          esac
          expected_heading="# Kanae $KANAE_VERSION"
          actual_heading="$(head -n 1 RELEASE_NOTES.md)"
          if [ "$actual_heading" != "$expected_heading" ]; then
            echo "RELEASE_NOTES.md heading must be: $expected_heading" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/kanae-v$KANAE_VERSION" >/dev/null 2>&1; then
            echo "release tag already exists: kanae-v$KANAE_VERSION" >&2
            exit 1
          fi

      - name: Show toolchain
        run: |
          swift --version
          uname -a
          uname -m

      - name: Package release
        env:
          KANAE_VERSION: ${{ inputs.version }}
        run: sh scripts/package-release.sh

      - name: Verify release
        env:
          KANAE_VERSION: ${{ inputs.version }}
        run: sh scripts/verify-release.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          KANAE_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          tag="kanae-v$KANAE_VERSION"
          notes_file="$(mktemp)"
          cp RELEASE_NOTES.md "$notes_file"
          cat >> "$notes_file" <<EOF

          ## Install

          \`\`\`sh
          curl -fsSL https://kanae.ultrahope.dev/install | sh
          \`\`\`
          EOF

          gh release create "$tag" \
            dist/kanae-v"$KANAE_VERSION"-*.tar.gz \
            dist/kanae-v"$KANAE_VERSION"-*.tar.gz.sha256 \
            --title "Kanae $KANAE_VERSION" \
            --notes-file "$notes_file"

      - name: Publish installer version
        env:
          KANAE_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          git fetch origin main
          git checkout -B publish-latest origin/main
          cat > docs/latest.json <<EOF
          {
            "version": "$KANAE_VERSION"
          }
          EOF
          if git diff --quiet -- docs/latest.json; then
            echo "docs/latest.json already points to $KANAE_VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json
          git commit -m "Publish Kanae $KANAE_VERSION"
          git push origin HEAD:main
