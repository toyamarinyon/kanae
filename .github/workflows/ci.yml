name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  release:
    name: Build and verify release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          uname -a
          uname -m

      - name: Package release
        env:
          KANAE_VERSION: 0.0.0
        run: sh scripts/package-release.sh

      - name: Verify release
        env:
          KANAE_VERSION: 0.0.0
        run: sh scripts/verify-release.sh
